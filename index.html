<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Live Test</title>
   
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body { font-family: 'Segoe UI', sans-serif; }
    .logo-text {
      font-weight: bold;
      font-size: 1.5rem;
    }
    .logo-orange {
      color: orange;
    }
    .btn-signup {
      background-color: orange;
      color: white;
    }
    .btn-signup:hover {
      background-color: darkorange;
    }
    .nav-link.active {
      font-weight: bold;
    }

  
</style>
<body>

  <!-- 1. Responsive Navbar -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
    <div class="container">
     <!-- Logo -->
     <div class="col-md-4 mb-3 mb-md-0">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src=" https://media.licdn.com/dms/image/v2/D5603AQGvBOURGKqgGA/profile-displayphoto-shrink_800_800/profile-displayphoto-shrink_800_800/0/1722056840413?e=1751500800&v=beta&t=i4ZH16N8hTwLiALHf-1xjYTdY_GQSxsVw1TG_05d39Y" alt="Epixelab" height="50" alt="Profile" width="50" height="40" class="rounded-circle me-2">
            <span>Rasel Ahmed</span>
          </a>
    </div>
       


      <!-- <a class="navbar-brand" href="#">MySite</a> -->

      <!-- Toggler for mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Nav links -->
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="#">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="#">Our App</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="#">Contacts</a>
          </li>
        </ul>
      </div>

      <!-- Auth Buttons -->
      <div class="d-flex align-items-center navbar-nav ms-auto">
        <li class="nav-item"><a class="btn btn-outline-primary mx-2" href="#">Log in</a></li>
        <a href="#" class="btn btn-signup">Sign up</a>
      </div>
    </div>
  </nav>

  <div class="container mt-5">

    <!-- 2. 10 Different Style Buttons -->
    <h3>Bootstrap Buttons</h3>
    <button class="btn btn-primary m-1">Primary</button>
    <button class="btn btn-secondary m-1">Secondary</button>
    <button class="btn btn-success m-1">Success</button>
    <button class="btn btn-danger m-1">Danger</button>
    <button class="btn btn-warning m-1">Warning</button>
    <button class="btn btn-info m-1">Info</button>
    <button class="btn btn-light m-1">Light</button>
    <button class="btn btn-dark m-1">Dark</button>
    <button class="btn btn-outline-primary m-1">Outline Primary</button>
    <button class="btn btn-link m-1">Link</button>

    <!-- 3. Pop-up Modal -->
    <h3 class="mt-5">Bootstrap Modal</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">Open Modal</button>

    <div class="modal fade" id="myModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Modal Title</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="col-md-4 mb-3 mb-md-0">
                <a class="navbar-brand d-flex align-items-center" href="#">
                    <img src=" https://media.licdn.com/dms/image/v2/D5603AQGvBOURGKqgGA/profile-displayphoto-shrink_800_800/profile-displayphoto-shrink_800_800/0/1722056840413?e=1751500800&v=beta&t=i4ZH16N8hTwLiALHf-1xjYTdY_GQSxsVw1TG_05d39Y" alt="Epixelab" height="50" alt="Profile" width="50" height="40" class="rounded-circle me-2">
                    <span>Rasel Ahmed</span>
                  </a>
            </div> <br>
            This is a Bootstrap modal popup!
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary">Save changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. Progress Bar -->
    <h3 class="mt-5">Bootstrap Progress Bar</h3>
    <div class="progress">
      <div class="progress-bar" role="progressbar" style="width: 70%;">70%</div>
    </div>

    <!-- 5. Input Boxes -->
<h3 class="mt-5">Input Boxes</h3>
<form>
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" class="form-control" placeholder="Enter your name">
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" class="form-control" placeholder="Enter your email">
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" placeholder="Enter your password">
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>


  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
